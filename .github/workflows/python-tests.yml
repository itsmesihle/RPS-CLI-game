#automation tests will live here

name: Python Testing Suite

on: [push, pull_request] # Trigger this whenever you push code

jobs:
  build:
    runs-on: ubuntu-latest # The type of virtual machine to use

    steps:
      - uses: actions/checkout@v4 # 1. Download your code onto the VM

      - name: Set up Python
        uses: actions/setup-python@v5 # 2. Install Python on the VM
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt # 3. Install pytest and pyfiglet

      - name: Run tests with pytest
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_project.py # 4. Execute your test file
